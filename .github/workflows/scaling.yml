name: Qiskit Aer scaling benchmark

on:
  workflow_dispatch:
    inputs:
      max_qubits:
        description: "Maximum qubit count (even). Full default sweep is 26."
        required: true
        default: "26"
        type: choice
        options:
          - "16"
          - "20"
          - "24"
          - "26"
  push:
    paths:
      - "scripts/run_scaling_aer.py"
      - "tests/test_scaling_aer.py"
      - ".github/workflows/scaling.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "scripts/run_scaling_aer.py"
      - "tests/test_scaling_aer.py"
      - ".github/workflows/scaling.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  qiskit-aer-scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Qiskit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Unit tests
        run: pytest
      - name: Run scaling sweep
        env:
          MAX_QUBITS: "${{ github.event.inputs.max_qubits || '26' }}"
        run: |
          mkdir -p results/scaling_aer
          python scripts/run_scaling_aer.py --max-qubits "$MAX_QUBITS" --output-dir results/scaling_aer
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hisab-qiskit-aer-scaling-${{ github.run_number }}
          path: results/scaling_aer/
          if-no-files-found: warn
          retention-days: 90
