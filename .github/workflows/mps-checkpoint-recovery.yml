name: MPS checkpoint recovery probe

on:
  push:
    paths:
      - "scripts/run_mps_bond_sweep.py"
      - "tests/test_mps_bond_sweep.py"
      - "docs/MPS_BOND_SWEEP_PROTOCOL.md"
      - ".github/workflows/mps-checkpoint-recovery.yml"
  pull_request:
    paths:
      - "scripts/run_mps_bond_sweep.py"
      - "tests/test_mps_bond_sweep.py"
      - "docs/MPS_BOND_SWEEP_PROTOCOL.md"
      - ".github/workflows/mps-checkpoint-recovery.yml"

permissions:
  contents: read

jobs:
  checkpoint-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Qiskit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Unit tests including forced timeout recovery
        run: pytest
      - name: Run 24-qubit chi=512 checkpoint probe (5-minute MPS budget)
        run: |
          mkdir -p results/mps_checkpoint_probe
          python scripts/run_mps_bond_sweep.py \
            --n-qubits 24 \
            --seed 11 \
            --bond-dimension 512 \
            --mps-timeout-seconds 300 \
            --output-dir results/mps_checkpoint_probe
      - name: Upload checkpoint even on timeout or error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mps-checkpoint-probe-n24-chi512-seed11
          path: results/mps_checkpoint_probe/
          if-no-files-found: warn
          retention-days: 90
