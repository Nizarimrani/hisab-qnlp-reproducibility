name: Tensor-network comparison (statevector vs MPS)

on:
  workflow_dispatch:
    inputs:
      max_qubits:
        description: "Largest qubit size in this comparison"
        required: true
        default: "26"
        type: choice
        options: ["20", "22", "24", "26"]
      max_bond_dimension:
        description: "Maximum retained MPS bond dimension"
        required: true
        default: "128"
        type: choice
        options: ["32", "64", "128", "256"]
  push:
    paths:
      - "scripts/run_mps_comparison.py"
      - "tests/test_mps_comparison.py"
      - "docs/TENSOR_NETWORK_PROTOCOL.md"
      - ".github/workflows/tensor-network-comparison.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "scripts/run_mps_comparison.py"
      - "tests/test_mps_comparison.py"
      - "docs/TENSOR_NETWORK_PROTOCOL.md"
      - ".github/workflows/tensor-network-comparison.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  mps-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Qiskit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Unit tests
        run: pytest
      - name: Run matched statevector/MPS comparison
        env:
          MAX_QUBITS: "${{ github.event.inputs.max_qubits || '26' }}"
          MAX_BOND_DIMENSION: "${{ github.event.inputs.max_bond_dimension || '128' }}"
        run: |
          mkdir -p results/tensor_network
          python scripts/run_mps_comparison.py \
            --min-qubits 20 \
            --max-qubits "$MAX_QUBITS" \
            --max-bond-dimension "$MAX_BOND_DIMENSION" \
            --truncation-threshold 1e-12 \
            --output-dir results/tensor_network
      - name: Upload tensor-network comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hisab-statevector-mps-comparison-${{ github.run_number }}
          path: results/tensor_network/
          if-no-files-found: warn
          retention-days: 90
