name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[test]
      - run: pytest
      - name: Reject common credential patterns
        run: |
          ! grep -RInE "save_account\(|token[[:space:]]*=[[:space:]]*['\"]" --exclude-dir=.git .

