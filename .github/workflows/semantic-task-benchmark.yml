name: Structured semantic task benchmark

on:
  push:
    paths:
      - "scripts/run_semantic_task_benchmark.py"
      - "tests/test_semantic_task_benchmark.py"
      - "docs/SEMANTIC_TASK_BENCHMARK.md"
      - "pyproject.toml"
      - ".github/workflows/semantic-task-benchmark.yml"
  pull_request:
    paths:
      - "scripts/run_semantic_task_benchmark.py"
      - "tests/test_semantic_task_benchmark.py"
      - "docs/SEMANTIC_TASK_BENCHMARK.md"
      - "pyproject.toml"
      - ".github/workflows/semantic-task-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-task:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned project and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,benchmark]'
      - name: Run unit tests
        run: pytest
      - name: Execute full structured task benchmark
        run: python scripts/run_semantic_task_benchmark.py --output-dir results/semantic_task
      - name: Upload dataset and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hisab-semantic-task-benchmark-${{ github.run_number }}
          path: results/semantic_task/
          if-no-files-found: warn
          retention-days: 90
